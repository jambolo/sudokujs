<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SudokuJS</title>
<meta name="viewport" id="metaViewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:;base64,iVBORw0KGgo=">
<meta name="theme-color" content="#333333">
<link rel="manifest" href="manifest.json">
<style>
* {
  margin: 0;
  padding: 0;
}
html, body {
  overflow:hidden;
  height:100%;
}
canvas {
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}
dialog {
  margin:auto;
  width:min(40em, 94vw);
  height:92vh;
  border:none;
  border-radius:8px;
  overflow:hidden;
  background:#ffffff;
}
dialog[open] {
  display:flex;
  flex-direction:column;
}
dialog::backdrop {
  background:rgba(0, 0, 0, 0.6);
}
dialog header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0.4em 0.4em 0.4em 1em;
  font:bold 18px system-ui, sans-serif;
  color:#ffffff;
  background:#333333;
}
dialog button {
  width:2em;
  height:2em;
  border:none;
  border-radius:4px;
  font:inherit;
  font-size:22px;
  color:#ffffff;
  background:#008833;
  cursor:pointer;
}
dialog iframe {
  flex:1;
  width:100%;
  border:none;
}
@font-face {
    font-family: "saxMono";
    src: url(fonts/saxmono.ttf) format("truetype");
}
</style>
<!-- <link rel="stylesheet" href="css/notie.min.css" /> -->
</head>
<body>
<dialog id="help" aria-labelledby="helpTitle">
<header><span id="helpTitle">Help</span><button id="helpClose" aria-label="Close">&times;</button></header>
<iframe src="help.html" title="How to use the app"></iframe>
</dialog>
<script src="lib/index.js"></script>
</body>
</html>
